<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V EFFECT - サポート</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin-top: 40px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        p {
            color: #AAAAAA;
            margin-bottom: 20px;
        }
        .contact-box {
            background-color: #1A1A1A;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .contact-box h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .email {
            font-size: 16px;
            color: #FFFFFF;
            font-weight: bold;
            display: block;
            margin-bottom: 16px;
            word-break: break-all;
        }
        .btn {
            display: inline-block;
            background-color: #FFFFFF;
            color: #000000;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: bold;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #666666;
            text-align: center;
        }
        a {
            color: #FFFFFF;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>V EFFECT サポート窓口</h1>
        
        <p>V EFFECTをご利用いただきありがとうございます。<br>
        アプリに関するご質問、不具合の報告、アカウント削除のご依頼などは、以下の窓口にて承っております。</p>

        <div class="contact-box">
            <h2>メールでのお問い合わせ</h2>
            <p>以下のメールアドレス宛にご連絡ください。通常、2〜3営業日以内に返信いたします。</p>
            <a href="mailto:V.EFFECT.developer@gmail.com" class="email">V.EFFECT.developer@gmail.com</a>
        </div>

        <div class="contact-box">
            <h2>お問い合わせフォーム</h2>
            <p>Googleフォームからもお問い合わせいただけます。<br>（※Googleアカウントへのログインが必要な場合があります）</p>
            <a href="https://forms.gle/Zj29yQmSSKCZ4Kar8" target="_blank" class="btn">フォームを開く</a>
        </div>

        <div class="footer">
            &copy; 2026 V EFFECT Development Team
        </div>
    </div>
</body>
</html>
