<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V EFFECT - リダイレクト中</title>
    <script>
        (function() {
            var path = window.location.pathname;
            // ユーザープロフィールURL (/@username または /u/userId) の場合、Webアプリへ自動転送
            if (path.startsWith('/@') || path.startsWith('/u/')) {
                window.location.replace('https://veffect-app.web.app' + path + window.location.search + window.location.hash);
            } else {
                // それ以外の存在しないページの場合は、LPのトップページへ戻す
                window.location.replace('/');
            }
        })();
    </script>
</head>
<body style="margin: 0; background-color: #000;">
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h2 style="font-weight: 600; margin-bottom: 8px; letter-spacing: 2px;">V EFFECT</h2>
        <p style="color: #888; font-size: 14px;">Webアプリへ移動しています...</p>
    </div>
</body>
</html>
