<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V EFFECT</title>
    <meta name="description" content="1. あなたが習慣化したいことを決めよう。 2. 共に高め合える友達や大切な人を誘おう。 3. 自分が勝利したヒーロータスクを写真付きで証明しよう。">
    
    <!-- SEO & OGP -->
    <meta property="og:title" content="V EFFECT">
    <meta property="og:description" content="勝ち癖を身につける、新しい努力・勝利共有SNS">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://veffect.web.app">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #FFFFFF;
            --text-secondary: #86868b; /* Apple-like gray */
            --accent-gold: #D4AF37; /* Metallic gold */
            --border-color: rgba(255, 255, 255, 0.1);
            
            --font-outfit: 'Outfit', 'Inter', 'Noto Sans JP', sans-serif;
            --font-jp: 'Noto Sans JP', 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-jp);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ヘッダー */
        header {
            width: 100%;
            max-width: 800px;
            padding: 40px 24px;
            display: flex;
            justify-content: center;
        }

        .logo-text {
            font-family: var(--font-outfit);
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 0.15em;
            color: var(--text-primary);
            text-align: center;
        }

        /* メインコンテンツ */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 640px;
            padding: 20px 24px 60px;
        }

        /* Apple風ミニマルリスト */
        .steps-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-bottom: 60px;
        }

        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            text-align: left;
        }

        .step-num {
            font-family: var(--font-outfit);
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-gold);
            line-height: 1;
            min-width: 40px;
        }

        .step-text {
            font-size: 17px;
            font-weight: 400;
            line-height: 1.6;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        /* ダウンロードセクション */
        .download-section {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .store-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 980px; /* Apple-like capsule button */
            padding: 14px 32px;
            color: #000000;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }

        .store-button:hover {
            transform: scale(1.03);
            background: #f5f5f7;
            box-shadow: 0 6px 20px rgba(255,255,255,0.15);
        }

        .store-button:active {
            transform: scale(0.98);
        }

        .store-icon {
            margin-right: 8px;
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* フッター */
        footer {
            width: 100%;
            max-width: 800px;
            padding: 40px 24px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 16px;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--text-primary);
        }

        .copyright {
            margin-top: 8px;
        }

        /* レスポンシブ */
        @media (max-width: 480px) {
            .step-text {
                font-size: 15px;
            }
            .step-num {
                font-size: 28px;
                min-width: 32px;
            }
            .steps-container {
                gap: 32px;
            }
            header {
                padding: 30px 24px;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="logo-text">V EFFECT</div>
    </header>

    <!-- メインコンテンツ -->
    <main>
        <div class="steps-container">
            <!-- STEP 1 -->
            <div class="step-item">
                <span class="step-num">1</span>
                <p class="step-text">あなたが習慣化したいことを決めよう。</p>
            </div>
            
            <!-- STEP 2 -->
            <div class="step-item">
                <span class="step-num">2</span>
                <p class="step-text">共に高め合える友達や大切な人を誘おう。</p>
            </div>
            
            <!-- STEP 3 -->
            <div class="step-item">
                <span class="step-num">3</span>
                <p class="step-text">「V FEED」に自分が勝利したヒーロータスク（読書、資格勉強、ワークアウト等）を写真付きで証明しよう。</p>
            </div>
        </div>

        <!-- ダウンロード誘導 -->
        <div class="download-section">
            <a href="https://apps.apple.com/jp/app/v-effect/id6763709764" class="store-button" target="_blank" rel="noopener noreferrer" id="app-store-download-btn">
                <svg class="store-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.82M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.22.67-2.94 1.51-.64.74-1.2 1.88-1.05 2.99 1.11.09 2.27-.58 3-1.44Z"/>
                </svg>
                <span>App Store からダウンロード</span>
            </a>
        </div>
    </main>

    <!-- フッター -->
    <footer>
        <div class="footer-links">
            <a href="/support" class="footer-link">サポート</a>
            <a href="/terms" class="footer-link">利用規約</a>
            <a href="/privacy" class="footer-link">プライバシーポリシー</a>
        </div>
        <div class="copyright">
            &copy; 2026 V EFFECT.
        </div>
    </footer>

</body>
</html>
